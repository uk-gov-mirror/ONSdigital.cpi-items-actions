name: Update data

on:
  schedule:
  - cron: "01 07 14-27 * *" 
    timezone: "Europe/London"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository content
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        
      - name: Install R pacakges
        run: |
          install.packages(c("openxlsx", "jsonlite"))
        shell: Rscript {0}

      - name: Import data
        run: Rscript -e 'source("R/process_data.R")' # Run R script

      - name: Commit and push results
        run: |
         git config --global user.name "github-actions[bot]"
         git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
         git add -A
         git commit -m 'GitHub Actions Results added' || echo "No changes to commit"
         git push origin || echo "No changes to commit"
